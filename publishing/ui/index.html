<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><main><header><b>Folio <i>Local</i></b><a href="http://127.0.0.1:4175/" target="_blank" rel="noopener">查看本地测试站 ↗</a></header>
